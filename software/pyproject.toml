[project]
name = "ldv-automation"
version = "0.2.0"
description = "Automatisierung von Strukturtests mit einem 3D-Laser-Doppler-Vibrometer (Bachelorarbeit, SLA, RWTH Aachen)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6",
    # Auswertungsoberfläche (P-AUSW T1.1): Zeichenfunktionen in ``darstellung/`` (matplotlib)
    # und der .svd-Leser im Paket (olefile, ADR-020).
    "matplotlib>=3.11.2",
    "olefile>=0.47",
    # 6.11.3 statt 6.12.0 nach ADR-001 (Nachtrag, Nutzerentscheidung 2026-10-27):
    # 6.12.0 verliert unter Python 3.11 bei jedem Qt-Aufruf ohne Rückgabewert eine
    # Referenz auf None (Absturz „none_dealloc“). Regressionstest in tests/gui.
    "pyside6-essentials==6.11.3",
]

[project.optional-dependencies]
# Windows-COM-Zugriff auf PSV. Nur unter Windows installierbar; unter Linux wird die
# Abhängigkeit durch den Marker übersprungen, damit `uv sync` dort fehlerfrei läuft.
com = ["pywin32>=306; sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "hatchling>=1.25",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt==4.5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ldv_automation"]

# Build-Info (Git-Hash, ADR-012): erzeugt der Hook beim Wheel-Bau aus dem aktuellen Git-Stand
# (K-U5). Eine Datei im Quellbaum wird nie gepackt (.gitignore); ohne Git bricht der Bau ab.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "D"]
ignore = [
    "D105",  # Docstring für magische Methoden nicht nötig
    "D107",  # Docstring für __init__ steht im Klassen-Docstring (NumPy-Stil)
]

# Der Gedankenstrich „–“ ist in den Oberflächentexten des Design-Briefs P3 vorgegeben.
allowed-confusables = ["–"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # Tests dokumentieren sich über ihre Namen
# Der Python-Versions-Check steht bewusst vor den übrigen Imports (klarer Hinweis statt Absturz).
"tools/erkundung/erkundung.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tools/erkundung", "tools/build_info", "tools/svd_analyse", "tools/auswertung"]
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools/erkundung", "tools/build_info", "tools/svd_analyse", "tools/auswertung"]
addopts = "-ra --strict-markers -m 'not hardware and not gui'"
# Das Constrained Layout darf nie wegen zu kleiner Achsen aussetzen (Oberfläche und Zeichenfunktionen).
filterwarnings = ["error:constrained_layout not applied:UserWarning"]
markers = [
    "hardware: braucht echte Hardware bzw. den Messrechner (standardmäßig abgewählt; `pytest -m hardware`)",
    "gui: Oberflächentest mit Qt (pytest-qt, `QT_QPA_PLATFORM=offscreen`, setzt Qt-Systembibliotheken voraus; standardmäßig abgewählt; `pytest -m gui`)",
]

[tool.coverage.run]
branch = true
source = [
    "src/ldv_automation",
    "tools/erkundung",
    "tools/build_info",
    "tools/svd_analyse",
    "tools/auswertung",
]

# Qt-Widget-Module der Oberfläche: Sie laufen nur in den GUI-Tests (`pytest -m gui`, offscreen,
# Qt-Systembibliotheken nötig), die standardmäßig abgewählt sind (KONVENTIONEN: Oberflächentests
# per Marker). Die GUI-Logik (Aktivierung, Hinweisband, Fortschritt, Zeilenstatus, Prüfungen)
# liegt Qt-frei in `gui/anzeige.py` und `gui/tokens.py` und wird im Standardlauf voll gemessen.
# Abdeckung der Widget-Module separat:
#   QT_QPA_PLATFORM=offscreen uv run pytest -m gui --cov --cov-config=tests/gui/coverage_gui.toml
omit = [
    "src/ldv_automation/gui/hauptfenster.py",
    "src/ldv_automation/gui/tabelle.py",
    "src/ldv_automation/gui/editor.py",
    "src/ldv_automation/gui/hinweisband.py",
    "src/ldv_automation/gui/dialoge.py",
    "src/ldv_automation/gui/stil.py",
    "src/ldv_automation/gui/start.py",
    # Auswertungsoberfläche (P-AUSW T3a): Widgets mit Qt und matplotlib-Canvas, nur offscreen
    # prüfbar; Logik (Parameterzeile, Zustände, Prüftext, Reiterkopf, Plotstil) liegt Qt-frei in
    # `gui/anzeige_auswerten.py` und `gui/plotstil.py` und wird im Standardlauf voll gemessen.
    "src/ldv_automation/gui/auswerten_reiter.py",
    "src/ldv_automation/gui/plotflaeche.py",
    # T3b: Auswahlseiten (AD) und Tabellen (AE) der Ansichten 2 bis 4, ebenfalls reine Widgets;
    # ihre Zeilen und Texte entstehen Qt-frei in `gui/daten_auswerten.py` (voll gemessen).
    "src/ldv_automation/gui/auswahl_auswerten.py",
    "src/ldv_automation/gui/tabellen_auswerten.py",
    # T4: Prüfdialog (Widget) und QSettings-Hülle; Zeilen, Listen und Pfade entstehen Qt-frei in
    # `gui/anzeige_aktionen.py`, der Cursor liegt Qt-frei in `gui/cursor.py` (beide voll gemessen).
    "src/ldv_automation/gui/pruefdialog.py",
    "src/ldv_automation/gui/einstellungen_auswerten.py",
    # R-073 (P-AUSW2 S3): Achsenleiste AG ist ein reines Widget (Eingabefelder, Umschalter,
    # Flusslayout `FlussLayout._ordne`, Fokus- und Ereignisbehandlung), nur offscreen prüfbar
    # (`pytest -m gui`, dort zu rund 95 % gemessen). Einlesen, Prüfung, Anzeigeformat und Texte
    # der Eingaben liegen Qt-frei in `darstellung/achsen.py` (`parse_zahl`, `feld_text`,
    # `uebernehme_eingabe`), der Zustand in `gui/achsen_zustand.py` (beide voll gemessen).
    "src/ldv_automation/gui/achsenleiste.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[[tool.mypy.overrides]]
# pywin32 und winreg gibt es nur unter Windows und sie liefern keine Typen mit.
module = ["win32com", "win32com.*", "pythoncom", "winreg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# olefile (.svd-Leser in ldv_automation.auswertung) liefert keine Typinformationen mit.
module = ["olefile", "olefile.*"]
ignore_missing_imports = true
