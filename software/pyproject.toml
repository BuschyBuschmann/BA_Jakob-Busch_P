[project]
name = "ldv-automation"
version = "0.1.0"
description = "Automatisierung von Strukturtests mit einem 3D-Laser-Doppler-Vibrometer (Bachelorarbeit, SLA, RWTH Aachen)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
# Windows-COM-Zugriff auf PSV. Nur unter Windows installierbar; unter Linux wird die
# Abhängigkeit durch den Marker übersprungen, damit `uv sync` dort fehlerfrei läuft.
com = ["pywin32>=306; sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ldv_automation"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "D"]
ignore = [
    "D105",  # Docstring für magische Methoden nicht nötig
    "D107",  # Docstring für __init__ steht im Klassen-Docstring (NumPy-Stil)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # Tests dokumentieren sich über ihre Namen

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tools/erkundung"]
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools/erkundung"]
addopts = "-ra --strict-markers -m 'not hardware'"
markers = [
    "hardware: braucht echte Hardware bzw. den Messrechner (standardmäßig abgewählt; `pytest -m hardware`)",
]

[tool.coverage.run]
branch = true
source = ["src/ldv_automation", "tools/erkundung"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[[tool.mypy.overrides]]
# pywin32 und winreg gibt es nur unter Windows und sie liefern keine Typen mit.
module = ["win32com", "win32com.*", "pythoncom", "winreg"]
ignore_missing_imports = true
